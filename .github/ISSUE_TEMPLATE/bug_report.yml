name: Bug Report
description: Report an issue with workstation-sentinel
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug report! Please provide system details to help us diagnose the problem.
  - type: input
    id: os_version
    attributes:
      label: Windows Version & Build
      description: e.g. Windows 11 Pro 23H2 (Build 22631) or Windows 11 Home (Build 26200)
      placeholder: Windows 11 Home Single Language Build 26200
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sentinel Logs
      description: Paste relevant lines from `sentinel.log` or Event Viewer.
      render: text
