name: Feature Request
description: Suggest an enhancement or new power-management capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
      description: What behavior or configuration option should be added?
    validations:
      required: true
